name: claude-dev Image CI (PR)
permissions: {}

on:
  push:
    branches:
      - "renovate/**"
  pull_request:
    paths:
      - ".github/workflows/build.pr.yml"
      - "build/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-claude-dev:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'renovate/')
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # the runner is discarded after the job; removing the builder took 20-40 s
          cleanup: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the master cache (a branch can read its default branch's cache) and never writes:
      # branch-scoped entries are unreadable from master and count against the same 10 GB quota.
      # The smoke stage runs the checks inside BuildKit, so the image is not loaded into docker.
      - name: Build and smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "{{defaultContext}}:build"
          file: Dockerfile
          target: smoke
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          outputs: type=cacheonly
