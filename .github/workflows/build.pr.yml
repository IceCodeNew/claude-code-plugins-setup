name: claude-dev Image CI (PR)
permissions: {}

on:
  push:
    branches:
      - "renovate/**"
  pull_request:
    paths:
      - ".github/workflows/build.pr.yml"
      - "build/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CLAUDE_DEV_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/claude-dev

jobs:
  ci-claude-dev:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "{{defaultContext}}:build"
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          load: true
          tags: ${{ env.CLAUDE_DEV_IMAGE }}:pr-test
      - name: Smoke test
        run: |
          test_image="${CLAUDE_DEV_IMAGE}:pr-test"
          docker image inspect "${test_image}"
          docker run --rm --entrypoint claude "${test_image}" --version
          docker run --rm --entrypoint codex  "${test_image}" --version
          docker run --rm --entrypoint yq     "${test_image}" --version
          docker run --rm --entrypoint bash   "${test_image}" -lc \
              'python -c "import claude_agent_sdk, yaml" && claude plugin list && ls ~/.agents/skills'
